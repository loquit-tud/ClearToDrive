name: cleartodrive
description: ClearToDrive — local reminders for Romanian vehicle documents (RCA, ITP, rovinieta).
publish_to: 'none'
version: 0.3.6+9

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  get_it: ^8.0.3
  go_router: ^14.8.1
  intl: ^0.20.2
  uuid: ^4.5.1
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  cross_file: ^0.3.4
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.33.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  generate: true
